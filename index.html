<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Школа Теократического служения</title>

<!-- ИКОНКИ И НАСТРОЙКИ ДЛЯ СМАРТФОНОВ (iOS / Android) -->
<link rel="icon" type="image/png" href="iconshts.png">
<link rel="apple-touch-icon" href="iconshts.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Школа Теократии">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
  background:#f8f8f8;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px;
}

h1{
  height:8vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(16px, 3vh, 24px);
  color:#222;
  margin-bottom:6px;
  text-align: center;
  padding: 0 4px;
}

.container{
  flex:1;
  width:min(100%,390px);
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:10px;
}

.square{
  background:#e60000;
  border-radius:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(34px,7vw,54px);
  font-weight:bold;
  color:white;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
  transition: transform 0.25s, background-color 0.25s;
  user-select:none;
  cursor: pointer;
  will-change: transform;
}

.square.gray,
.square.green {
  animation: none !important;
  transform: scale(1) rotate(0deg) translate(0, 0) !important;
}

.square.gray{
  background:#555;
}

.square.green{
  background:#18a558;
}

.square:active{
  transform:scale(.90) !important;
}

.reset-btn{
  height:48px;
  margin-top:10px;
  padding:0 30px;
  border:none;
  border-radius:30px;
  background:#333;
  color:white;
  font-size:17px;
  flex-shrink:0;
  cursor: pointer;
}

.particle{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  will-change: transform; 
}

/* ---------- 10 УНИКАЛЬНЫХ АНИМАЦИЙ ДВИЖЕНИЯ ---------- */
@keyframes move1 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes move2 {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(3deg); }
}
@keyframes move3 {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
@keyframes move4 {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-5px); }
}
@keyframes move5 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(4px, -4px); }
}
@keyframes move6 {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(-2deg) scale(1.03); }
}
@keyframes move7 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}
@keyframes move8 {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-3deg); }
}
@keyframes move9 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-4px, -4px); }
}
@keyframes move10 {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(0.96); }
}

.square-1 { animation: move1 3s ease-in-out infinite; }
.square-2 { animation: move2 2.6s ease-in-out infinite; }
.square-3 { animation: move3 3.4s ease-in-out infinite; }
.square-4 { animation: move4 2.8s ease-in-out infinite; }
.square-5 { animation: move5 3.2s ease-in-out infinite; }
.square-6 { animation: move6 3s ease-in-out infinite; }
.square-7 { animation: move7 2.5s ease-in-out infinite; }
.square-8 { animation: move8 2.9s ease-in-out infinite; }
.square-9 { animation: move9 3.3s ease-in-out infinite; }
.square-10 { animation: move10 3.1s ease-in-out infinite; }
</style>
</head>

<body>
<h1>Школа Теократии для детей</h1>
<div class="container" id="container"></div>
<button class="reset-btn" onclick="resetAll()">Сбросить прогресс</button>

<script> 
localStorage.clear();

let currentPlayingAudio = null;

// ---------- ПРЕДЗАГРУЗКА ВСЕХ ЗВУКОВ (WAV) ----------
const taskAudioCache = {};
const congratsAudioCache = {};

function preloadAudio() {
    for (let i = 1; i <= 10; i++) {
        const taskAudio = new Audio();
        taskAudio.src = i + ".wav";
        taskAudio.preload = "auto";
        taskAudioCache[i] = taskAudio;

        const congratsAudio = new Audio();
        congratsAudio.src = "congrats" + i + ".wav";
        congratsAudio.preload = "auto";
        congratsAudioCache[i] = congratsAudio;
    }
}
preloadAudio();

function stopCurrentAudio() {
    if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        currentPlayingAudio = null;
    }
}

function playTaskSound(number) {
    stopCurrentAudio();
    const audio = taskAudioCache[number];
    if (audio) {
        currentPlayingAudio = audio;
        audio.play().catch(() => {});
    }
}

function playSpecificCongrats(number) {
    stopCurrentAudio();
    const audio = congratsAudioCache[number];
    if (audio) {
        currentPlayingAudio = audio;
        audio.play().catch(() => {});
    }
}

// ---------- ПУЛ ДЛЯ СЛУЧАЙНЫХ ПОЗДРАВЛЕНИЙ 1-9 ----------
let availableCongrats = [];

function initCongratsPool() {
    availableCongrats = [1, 2, 3, 4, 5, 6, 7, 8, 9];
}
initCongratsPool();

function playRandomCongratsSound() {
    if (availableCongrats.length === 0) {
        initCongratsPool();
    }
    const randomIndex = Math.floor(Math.random() * availableCongrats.length);
    const congratsNumber = availableCongrats.splice(randomIndex, 1)[0];
    
    playSpecificCongrats(congratsNumber);
}

// ---------- МАССИВ ДЛЯ СЛУЧАЙНЫХ АНИМАЦИЙ 1-9 ----------
let availableAnimations = [];

function initAnimations() {
    availableAnimations = [
        () => megaConfetti(450),
        () => fireworksExplosion(),
        () => heartStorm(),
        () => starStorm(),
        () => rainbowCarnival(540),
        () => emojiCarnival(),
        () => sparkleBlizzard(),
        () => balloonFestival(),
        () => grandFireworkShow()
    ];
}
initAnimations();

function launchRandomAnimation() {
    if (availableAnimations.length === 0) {
        initAnimations();
    }
    const randomIndex = Math.floor(Math.random() * availableAnimations.length);
    const animation = availableAnimations.splice(randomIndex, 1)[0];
    animation();
}

// ---------- СОЗДАНИЕ КВАДРАТОВ ----------
const container = document.getElementById("container");

for (let i = 1; i <= 10; i++) {
    const square = document.createElement("div");
    square.className = `square square-${i}`;
    square.textContent = i;
    square.dataset.number = i;

    square.onclick = function () {
        if (this.classList.contains("green")) return;

        if (!this.classList.contains("gray")) {
            this.classList.add("gray");
            playTaskSound(i);
        } else {
            this.classList.remove("gray");
            this.classList.add("green");
            localStorage.setItem("square" + i, "green");
            
            if (i === 10) {
                ultimateCelebration();
                playSpecificCongrats(10);
            } else {
                launchRandomAnimation();
                playRandomCongratsSound();
            }
        }
    };

    container.appendChild(square);
}

// ---------- ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ----------
function random(min, max) {
    return Math.random() * (max - min) + min;
}

// ---------- СОЗДАНИЕ ЧАСТИЦ ----------
function createParticle(size, value, duration = 4) {
    const p = document.createElement("div");
    p.className = "particle";

    p.style.left = random(0, 100) + "vw";
    p.style.top = random(-15, -5) + "vh";
    p.style.fontSize = size + "px";

    const driftX = random(-120, 120); 
    p.style.setProperty('--drift-x', `${driftX}px`);

    const finalDuration = duration + Math.random() * 2;
    p.style.animation = `fall ${finalDuration}s linear forwards`;

    if (value.startsWith("#") || value.includes(",")) {
        const colors = value.split(",");
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.width = size + "px";
        p.style.height = (size * 1.5) + "px";
        p.style.borderRadius = "3px";
    } else {
        p.textContent = value;
    }

    document.body.appendChild(p);
    setTimeout(() => p.remove(), finalDuration * 1000);
}

function spawnBatch(count, callback) {
    let spawned = 0;
    const batchSize = Math.ceil(count / 10);
    
    function doSpawn() {
        const limit = Math.min(spawned + batchSize, count);
        for (let i = spawned; i < limit; i++) {
            callback();
        }
        spawned = limit;
        if (spawned < count) {
            requestAnimationFrame(doSpawn);
        }
    }
    doSpawn();
}

function megaConfetti(count){
    spawnBatch(count, () => {
        createParticle(
            7 + Math.random() * 8,
            "#ff0000,#18a558,#0066ff,#ffd700,#ff00aa,#00ffff,#ff8800",
            3.5
        );
    });
}

function fireworksExplosion(){
    for(let i=0; i<12; i++){
        setTimeout(()=>{
            megaConfetti(120);
        }, i * 120);
    }
}

function heartStorm(){
    const hearts = ["❤️", "💖", "💗", "💘", "💝"];
    spawnBatch(240, () => {
        createParticle(
            18 + Math.random() * 12,
            hearts[Math.floor(Math.random() * hearts.length)],
            4
        );
    });
}

// Звезды
function starStorm(){
    spawnBatch(270, () => {
        createParticle(
            20,
            "⭐",
            3.5
        );
    });
}

function rainbowCarnival(count){
    spawnBatch(count, () => {
        createParticle(
            9 + Math.random() * 5,
            "#ff0044,#ff8800,#ffee00,#00ff66,#0088ff,#aa00ff",
            4
        );
    });
}

function emojiCarnival(){
    const emojis = ["🎉", "🎊", "🥳", "🌟", "🚀", "💥", "✨", "🔥", "🎈", "🍭"];
    spawnBatch(240, () => {
        createParticle(
            22 + Math.random() * 12,
            emojis[Math.floor(Math.random() * emojis.length)],
            4
        );
    });
}

function sparkleBlizzard(){
    spawnBatch(450, () => {
        createParticle(
            5 + Math.random() * 6,
            "#ffffff,#ffff00,#ff88ff,#88ffff,#ffd700",
            3
        );
    });
}

function balloonFestival(){
    spawnBatch(135, () => {
        createParticle(
            30,
            "🎈",
            5
        );
    });
}

function grandFireworkShow(){
    for(let i=0; i<8; i++){ 
        setTimeout(()=>{
            fireworksExplosion();
        }, i * 250);
    }
}

function ultimateCelebration(){
    megaConfetti(500);
    setTimeout(() => emojiCarnival(), 200);
    setTimeout(() => heartStorm(), 500);
    setTimeout(() => starStorm(), 800);
    setTimeout(() => sparkleBlizzard(), 1100);
    setTimeout(() => balloonFestival(), 1400);
}

function resetAll(){
    if(confirm("Сбросить прогресс?")){
        localStorage.clear();
        stopCurrentAudio();
        initAnimations(); 
        initCongratsPool(); 
        document.querySelectorAll(".square").forEach(square=>{
            square.classList.remove("gray");
            square.classList.remove("green");
        });
    }
}

const style = document.createElement("style");
style.innerHTML = `
@keyframes fall {
    0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translate3d(var(--drift-x, 0px), 115vh, 0) rotate(720deg);
        opacity: 0;
    }
}
`;
document.head.appendChild(style);
</script>

</body>
</html>
